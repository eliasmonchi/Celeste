<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amor secreto ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mariposas/style.css">
    <style>
        :root { color-scheme: dark; --pink: #ff6b9a; --light-pink: #ffd6e4; --panel: rgba(28,10,28,.78); }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: #fff; font-family: Poppins,sans-serif; background: radial-gradient(circle at top,#7c294e,#241126 62%,#100812); }
        body::before { content: "❤  ✦  ❤  ✦  ❤"; position: fixed; inset: 8vh 0 auto; color: rgba(255,214,228,.18); font-size: clamp(2rem,8vw,6rem); letter-spacing: 1.5rem; text-align: center; pointer-events: none; }
        .page { width: min(920px,calc(100% - 2rem)); padding: clamp(1.5rem,5vw,3.5rem); text-align: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 2rem; box-shadow: 0 25px 80px rgba(0,0,0,.35); backdrop-filter: blur(12px); transition: opacity .5s; }
        .page[hidden] { display: none; }
        h1 { margin: 0 0 .5rem; color: var(--light-pink); }
        .intro { margin: 0 0 2rem; color: rgba(255,255,255,.78); }
        .lyrics { min-height: 8rem; margin: 1.5rem auto; padding: 1.5rem; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: .65rem; border-radius: 1.25rem; background: var(--panel); font-size: clamp(1.2rem,3vw,2rem); line-height: 1.8; }
        .word { color: rgba(255,255,255,.5); transition: color .2s,transform .2s; }
        .word.active { color: var(--pink); transform: translateY(-3px) scale(1.08); text-shadow: 0 0 18px rgba(255,107,154,.7); }
        audio { width: min(100%,600px); }
        .actions { display: flex; justify-content: center; gap: .75rem; flex-wrap: wrap; }
        button,.back-link { border: 0; border-radius: 999px; padding: .75rem 1.3rem; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
        .primary { color: #471225; background: var(--light-pink); }
        .secondary { color: #fff; background: rgba(255,255,255,.12); }
        .modal-backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem; background: rgba(10,3,12,.72); z-index: 2; }
        .modal-backdrop[hidden] { display: none; }
        .modal { width: min(440px,100%); padding: 2rem; text-align: center; background: #35152d; border: 1px solid rgba(255,214,228,.3); border-radius: 1.5rem; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
        .modal h2 { margin-top: 0; color: var(--light-pink); }
        select { width: 100%; padding: .8rem; margin: .5rem 0 1.25rem; border-radius: .75rem; border: 1px solid #b96585; color: #fff; background: #241126; font: inherit; }
        .panorama { position: fixed; inset: 0; z-index: 1; background: #08050a; }
        .panorama[hidden] { display: none; }
        .panorama canvas { display: block; width: 100%; height: 100%; }
        .lyrics-overlay { position: fixed; inset: 0; z-index: 1; display: flex; align-items: flex-end; justify-content: center; padding: 1.25rem; pointer-events: none; }
        .lyrics-card { width: min(520px, calc(100% - 1rem)); padding: .85rem 1.35rem; border: 1px solid rgba(255,255,255,.2); border-radius: 1rem; background: rgba(18, 7, 17, .52); box-shadow: 0 10px 30px rgba(0,0,0,.2); backdrop-filter: blur(4px); text-align: center; }
        .lyrics-line { margin: 0; color: rgba(255,240,246,.9); font-size: clamp(.78rem, 1.8vw, .95rem); line-height: 1.35; text-shadow: 0 1px 8px rgba(0,0,0,.8); transition: color .25s, opacity .25s, transform .25s; }
        .secret-lyrics-card { width: min(760px, calc(100% - 1rem)); padding: 1.1rem 1.5rem; }
        .secret-lyrics-line { font-size: clamp(1.05rem, 2.8vw, 1.7rem); line-height: 1.45; }
        .secret-lyrics-line:first-child { color: #ffd6e4; }
        .secret-lyrics-line.active { color: #fff; transform: scale(1.025); text-shadow: 0 0 18px rgba(255,107,154,.9); }
        .secret-lyrics-line.past { color: rgba(255,214,228,.72); }
        .bilingual-lyrics-card { width: min(760px, calc(100% - 1rem)); padding: 1.1rem 1.5rem; }
        .bilingual-lyrics-line { font-size: clamp(1.05rem, 2.8vw, 1.7rem); line-height: 1.45; }
        .bilingual-lyrics-line:first-child { color: #ffd6e4; }
        .bilingual-lyrics-line.active { color: #fff; transform: scale(1.025); text-shadow: 0 0 18px rgba(255,107,154,.9); }
        .bilingual-lyrics-line.past { color: rgba(255,214,228,.72); }
        .butterflies { position: fixed; inset: 0; z-index: 1; overflow: hidden; background: #0b0b0b; }
        .butterflies[hidden] { display: none; }
        .butterflies #app { position: absolute; inset: 0; }
        .butterflies #app canvas { z-index: 0; }
        .video-experience { position: fixed; inset: 0; z-index: 1; display: grid; place-items: stretch; overflow: hidden; padding: 0; background: #000; }
        .video-experience[hidden] { display: none; }
        #video-viewer { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        .video-experience video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
        @media (max-width: 600px) { body { overflow: auto; } .page { margin: 1rem 0; } }
    </style>
</head>
<body>
    <main class="page">
        <h1>Amor secreto ❤️</h1>
        <p class="intro">Elige una canción y deja que el momento aparezca ante ti.</p>
        <div class="actions">
            <button id="choose-song" class="primary" type="button">Elegir una canción</button>
            <a class="back-link secondary" href="index.html">Volver al inicio</a>
        </div>
    </main>
    <div id="song-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <form id="song-form" class="modal">
            <h2 id="modal-title">Selecciona una canción</h2>
            <label for="song-select">Nuestro momento musical</label>
            <select id="song-select" required>
                <option value="amor secreto/It Had To Be You.mp3">It Had To Be You — Frank Sinatra</option>
                <option value="amor secreto/Secret Love.mp3">Secret Love</option>
            </select>
            <button class="primary" type="submit">Reproducir ❤️</button>
        </form>
    </div>
    <section id="panorama" class="panorama" hidden aria-label="Vista 360 de boda">
        <div id="panorama-viewer"></div>
        <div class="lyrics-overlay">
            <div id="lyrics-card" class="lyrics-card bilingual-lyrics-card" aria-live="polite">
                <p id="song-spanish" class="lyrics-line bilingual-lyrics-line">La música está por comenzar...</p>
                <p id="song-english" class="lyrics-line bilingual-lyrics-line"></p>
            </div>
        </div>
    </section>
    <section id="butterflies" class="butterflies" hidden aria-label="Fondo de mariposas">
        <div class="lyrics-overlay">
            <div id="butterflies-lyrics" class="lyrics-card secret-lyrics-card" aria-live="polite">
                <p id="secret-spanish" class="lyrics-line secret-lyrics-line">La música está por comenzar...</p>
                <p id="secret-english" class="lyrics-line secret-lyrics-line"></p>
            </div>
        </div>
        <div id="app"></div>
    </section>
    <section id="video-experience" class="video-experience" hidden aria-label="Video local sin audio">
        <div id="video-viewer">
            <video id="space-video" preload="metadata" muted playsinline webkit-playsinline>
                <source src="amor secreto/espacio.mp4" type="video/mp4">
            </video>
        </div>
    </section>
    <audio id="song-player" preload="metadata"></audio>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

        const song = "amor secreto/It Had To Be You.mp3";
        const secretLove = "amor secreto/Secret Love.mp3";
        const panoramaImage = "amor secreto/boda.png";
        const modal = document.getElementById("song-modal");
        const form = document.getElementById("song-form");
        const player = document.getElementById("song-player");
        const page = document.querySelector(".page");
        const panorama = document.getElementById("panorama");
        const butterflies = document.getElementById("butterflies");
        const videoExperience = document.getElementById("video-experience");
        const videoViewer = document.getElementById("video-viewer");
        const spaceVideo = document.getElementById("space-video");
        const viewer = document.getElementById("panorama-viewer");
        const lyricsCard = document.getElementById("lyrics-card");
        const songSpanish = document.getElementById("song-spanish");
        const songEnglish = document.getElementById("song-english");
        const butterfliesLyrics = document.getElementById("butterflies-lyrics");
        const secretSpanish = document.getElementById("secret-spanish");
        const secretEnglish = document.getElementById("secret-english");
        const select = document.getElementById("song-select");
        let renderer;
        let camera;
        let controls;
        let butterfliesStarted = false;
        
        const secretLoveLyrics = [
            ["Una vez tuve un amor secreto", "Once I had a secret love"],
            ["Que vivía dentro del corazón de mí", "That lived within the heart of me"],
            ["Demasiado pronto mi amor secreto", "All too soon my secret love"],
            ["Se impacientó por ser libre", "Became impatient to be free"],
            ["Así que le dije a una estrella amistosa", "So I told a friendly star"],
            ["La forma en que los soñadores a menudo lo hacen", "The way that dreamers often do"],
            ["Lo maravilloso que eres", "Just how wonderful you are"],
            ["Y por qué estoy tan enamorado de ti", "And why I'm so in love with you"],
            ["Ahora lo grito desde la colina más alta", "Now I shout it from the highest hill"],
            ["Incluso dije a los narcisos de oro", "Even told the golden daffodils"],
            ["Por fin mi corazón es una puerta abierta", "At last my heart's an open door"],
            ["Y mi amor secreto ya no es secreto", "And my secret love's no secret anymore"],
            ["Ahora lo grito desde la colina más alta", "Now I shout it from the highest hill"],
            ["Incluso dije a los narcisos de oro", "Even told the golden daffodils"],
            ["Por fin mi corazón es una puerta abierta", "At last my heart's an open door"],
            ["Y mi amor secreto no es secreto", "And my secret love's no secret"],
            ["Mi amor secreto no es secreto", "My secret love's no secret"],
            ["Mi amor secreto ya no es secreto", "My secret love's no secret anymore"]
        ];
        const itHadToBeYouLyrics = [
            ["¿Por qué hago lo que dices?", "Why do I do, just as you say"],
            ["¿Por qué tengo que darte la razón?", "Why must I just, give you your way"],
            ["¿Por qué suspiro, por qué no intento olvidar?", "Why do I sigh, why don't I try to forget"],
            ["Debió ser algo que los amantes llaman destino", "It must have been, that something lovers call fate"],
            ["Que me mantuvo diciendo: tengo que esperar", "Kept me saying: I have to wait"],
            ["Los vi a todos, pero no pude enamorarme", "I saw them all, just couldn't fall"],
            ["Hasta que te conocí", "Till we met"],
            ["Tenía que ser tú, tenía que ser tú", "It had to be you, it had to be you"],
            ["Vagué por ahí, y finalmente encontré a alguien que", "I wandered around, and I finally found the somebody who"],
            ["Podía hacerme ser sincero", "Could make me be true"],
            ["Y podía hacerme sentir triste", "And could make me be blue"],
            ["Y hasta estar feliz, solo por estar triste, pensando en ti", "And even be glad, just to be sad, thinking of you"],
            ["Algunos otros que he visto", "Some others I've seen"],
            ["Nunca podrían ser crueles", "Might never be mean"],
            ["Nunca se enojarían, o intentarían mandar", "Might never be cross, or try to be boss"],
            ["Pero no servirían", "But they wouldn't do"],
            ["Porque nadie más, me dio esa emoción", "For nobody else, gave me a thrill"],
            ["Con todos tus defectos, aún te amo", "With all your faults, I love you still"],
            ["Tenía que ser tú", "It had to be you"],
            ["Maravilloso tú", "Wonderful you"],
            ["Tenía que ser tú", "It had to be you"],
            ["Porque nadie más, me dio esa emoción", "For nobody else, gave me a thrill"],
            ["Con todos tus defectos, aún te amo", "With all your faults, I love you still"],
            ["Tenía que ser tú", "It had to be you"],
            ["Maravilloso tú", "Wonderful you"],
            ["Tenía que ser tú", "It had to be you"]
        ];
        const itHadToBeYouVerseBreaks = new Set([6, 11, 15, 20]);
        let itHadToBeYouTimings = [];
        let itHadToBeYouTimingDuration = 0;

        function buildItHadToBeYouTimings(duration) {
            if (itHadToBeYouTimingDuration === duration) return;
            const usableDuration = Math.max(1, duration - 2);
            const weights = itHadToBeYouLyrics.map((line, index) => {
                const words = line[1].trim().split(/\s+/).length;
                return words + (itHadToBeYouVerseBreaks.has(index) ? 2.5 : 0);
            });
            const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
            let elapsed = 0.5;
            itHadToBeYouTimings = weights.map(weight => {
                const start = elapsed;
                elapsed += (weight / totalWeight) * usableDuration;
                return start;
            });
            itHadToBeYouTimingDuration = duration;
        }

        async function startButterflies() {
            if (butterfliesStarted) return;
            await import("./mariposas/script.js");
            butterfliesStarted = true;
        }

        async function startQuienVideo() {
            spaceVideo.currentTime = 0;
            spaceVideo.muted = true;
            const playRequest = spaceVideo.play();
            if (playRequest?.catch) await playRequest.catch(() => {});
        }

        function stopQuienVideo() {
            spaceVideo.pause();
            spaceVideo.currentTime = 0;
            spaceVideo.muted = true;
        }

        function createPanorama() {
            if (renderer) return;
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
            camera.position.set(0, 0, 0.1);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            viewer.append(renderer.domElement);
            const scene = new THREE.Scene();
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(500, 60, 40),
                new THREE.MeshBasicMaterial({ side: THREE.BackSide })
            );
            scene.add(sphere);
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(panoramaImage, texture => { sphere.material.map = texture; sphere.material.needsUpdate = true; }, undefined, () => {
                console.warn("No se pudo cargar la imagen 360.");
            });
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.35;
            window.addEventListener("resize", resizePanorama);
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
            resizePanorama();
        }
        function resizePanorama() {
            if (!renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        function resetExperience() {
            player.pause();
            player.currentTime = 0;
            stopQuienVideo();
            songSpanish.textContent = "La música está por comenzar...";
            songEnglish.textContent = "";
            songSpanish.classList.remove("active", "past");
            songEnglish.classList.remove("active", "past");
            panorama.hidden = true;
            butterflies.hidden = true;
            videoExperience.hidden = true;
            lyricsCard.hidden = false;
            secretSpanish.classList.remove("active", "past");
            secretEnglish.classList.remove("active", "past");
            secretSpanish.textContent = "La música está por comenzar...";
            secretEnglish.textContent = "";
            page.hidden = false;
            modal.hidden = false;
            select.focus();
        }
        form.addEventListener("submit", async event => {
            event.preventDefault();
            const selectedSong = select.value;
            if (selectedSong !== song && selectedSong !== secretLove) return;
            const isSecretLove = selectedSong === secretLove;
            stopQuienVideo();
            if (isSecretLove) {
                panorama.hidden = true;
                butterflies.hidden = false;
                videoExperience.hidden = true;
                page.hidden = true;
                await startButterflies();
                player.src = secretLove;
                secretSpanish.textContent = "";
                secretEnglish.textContent = "";
            } else {
                createPanorama();
                videoExperience.hidden = true;
                lyricsCard.hidden = true;
                player.src = song;
            }
            modal.hidden = true;
            page.hidden = true;
            panorama.hidden = isSecretLove;
            butterflies.hidden = !isSecretLove;
            videoExperience.hidden = true;
            player.play().catch(() => {});
        });
        document.getElementById("choose-song").addEventListener("click", () => { modal.hidden = false; select.focus(); });
        player.addEventListener("ended", resetExperience);
        player.addEventListener("timeupdate", () => {
            if (!player.duration) return;
            if (select.value === secretLove) {
                const elapsed = player.currentTime - 11;
                if (elapsed < 0) {
                    secretSpanish.textContent = "";
                    secretEnglish.textContent = "";
                    return;
                }
                const activeIndex = Math.min(secretLoveLyrics.length - 1, Math.floor((elapsed / Math.max(1, player.duration - 11)) * secretLoveLyrics.length));
                secretSpanish.textContent = secretLoveLyrics[activeIndex][0];
                secretEnglish.textContent = secretLoveLyrics[activeIndex][1];
                [secretSpanish, secretEnglish].forEach(line => line.classList.add("active"));
                return;
            }
            buildItHadToBeYouTimings(player.duration);
            let activeIndex = itHadToBeYouTimings.length - 1;
            for (let index = 0; index < itHadToBeYouTimings.length; index++) {
                if (player.currentTime < itHadToBeYouTimings[index]) {
                    activeIndex = Math.max(0, index - 1);
                    break;
                }
            }
            songSpanish.textContent = itHadToBeYouLyrics[activeIndex][0];
            songEnglish.textContent = itHadToBeYouLyrics[activeIndex][1];
            [songSpanish, songEnglish].forEach(line => line.classList.add("active"));
        });
        select.focus();
    </script>
</body>
</html>
